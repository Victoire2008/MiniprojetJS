<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de projets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Gestionnaire de projets</h1>

    <form id="project-form">
        <input type="text" id="name" placeholder="Nom du projet" required>
        <label for="date-début">Date de début:</label>
        <input type="date" id="date-début" required>
        <label for="date-fin">Date de fin:</label>
        <input type="date" id="date-fin"  required>
        <button type="submit">Ajouter le projet</button>
        <p id="message-erreur"></p>

    </form>

    <section>
        <h2>Mes projets</h2>
        <div id="projet-list">

        </div>

    </section>

    <section>
        <h2>Informations du navigateur</h2>
        <p id="dimensions"></p>
        <p id="navigateur"></p>
        
    </section>

    <section>
        <h2>Performance</h2>
        <p id="temps-chargement"></p>
    </section>

    <section>
        <h2>Statistiques</h2>
        <p id="nombre-projets"></p>
    </section>

    <script src="app.js"></script>
</body>
</html>
